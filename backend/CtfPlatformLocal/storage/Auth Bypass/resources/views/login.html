<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Intranet - TechCorp</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f7fa; margin: 0; padding: 0; }
    .login-container { max-width: 420px; margin: 100px auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    h1 { color: #1e3a8a; text-align: center; }
    input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
    button { width: 100%; padding: 14px; background: #1e3a8a; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
    button:hover { background: #2c4a9c; }
    .logo { text-align: center; font-size: 28px; margin-bottom: 20px; color: #1e3a8a; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">TechCorp</div>
    <h1>Intranet</h1>
    <p style="text-align:center; color:#666;">Zaloguj się do systemu wewnętrznego</p>
    
    <form method="POST" action="/login">
      <input type="text" name="username" value="regularuser" placeholder="Nazwa użytkownika" required>
      <input type="password" name="password" placeholder="Hasło" required>
      <button type="submit">Zaloguj się</button>
      <!--

          - Zmiana domyślnego konta administratorskiego z "admin" na coś mniej oczywistego → DONE
          
          ================================================
      -->

    </form>
  </div>
</body>
</html>
