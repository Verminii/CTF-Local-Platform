version: "3.9"

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - orchestrator

  orchestrator:
    build: ./orchestrator
    ports:
      - "5000:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  
      - ./backend/CtfPlatformLocal/storage:/storage 
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock